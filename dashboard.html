<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard &mdash; Project Guru</title>
<meta name="description" content="Project Guru live endpoint dashboard.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          guru: {
            bg: '#0a0e14',
            panel: '#111722',
            border: '#1f2937',
            accent: '#22d3ee',
          },
        },
      },
    },
  };
</script>
</head>
<body class="bg-guru-bg text-gray-200 antialiased">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 border-b border-guru-border bg-guru-bg/80 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="index.html" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-white">
        <svg class="h-6 w-6 text-guru-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>Project Guru</span>
      </a>
      <div class="flex items-center gap-4 text-sm font-medium text-gray-300">
        <span id="whoami" class="hidden text-gray-400"></span>
        <button id="logout-btn" class="hidden rounded-md border border-guru-border px-3 py-1.5 transition hover:border-guru-accent hover:text-guru-accent">
          Log out
        </button>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-12">

    <!-- Login panel -->
    <section id="login-panel" class="mx-auto max-w-sm">
      <h1 class="mb-6 text-center text-2xl font-bold text-white">Sign in</h1>
      <form id="login-form" class="space-y-4 rounded-lg border border-guru-border bg-guru-panel p-6">
        <div>
          <label class="mb-1 block text-sm text-gray-400" for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username"
                 class="w-full rounded-md border border-guru-border bg-guru-bg px-3 py-2 text-sm text-gray-200 focus:border-guru-accent focus:outline-none">
        </div>
        <div>
          <label class="mb-1 block text-sm text-gray-400" for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 class="w-full rounded-md border border-guru-border bg-guru-bg px-3 py-2 text-sm text-gray-200 focus:border-guru-accent focus:outline-none">
        </div>
        <p id="login-error" class="hidden text-sm text-red-400"></p>
        <button type="submit" class="w-full rounded-md bg-guru-accent px-4 py-2 text-sm font-semibold text-gray-900 transition hover:bg-cyan-300">
          Sign in
        </button>
        <p class="text-center text-xs text-gray-500">
          API base: <code id="api-base-label" class="text-gray-400"></code>
        </p>
      </form>
    </section>

    <!-- Endpoint list -->
    <section id="endpoints-panel" class="hidden">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">Endpoints</h1>
        <button id="refresh-btn" class="rounded-md border border-guru-border px-3 py-1.5 text-sm transition hover:border-guru-accent hover:text-guru-accent">
          Refresh
        </button>
      </div>
      <div id="endpoints-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <!-- Endpoint detail -->
    <section id="detail-panel" class="hidden">
      <button id="back-btn" class="mb-6 text-sm text-guru-accent hover:underline">&larr; Back to endpoints</button>
      <h1 id="detail-title" class="mb-6 text-2xl font-bold text-white"></h1>

      <div class="mb-8">
        <h2 class="mb-3 text-lg font-semibold text-white">Active alerts</h2>
        <div id="alerts-list" class="space-y-2"></div>
      </div>

      <div class="mb-8">
        <h2 class="mb-3 text-lg font-semibold text-white">Report types</h2>
        <div id="report-types-list" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
      </div>

      <div>
        <h2 class="mb-3 text-lg font-semibold text-white">Changes over time</h2>
        <div class="mb-3 flex flex-wrap items-end gap-3">
          <div>
            <label class="mb-1 block text-xs text-gray-400" for="diff-type">Message type</label>
            <select id="diff-type" class="rounded-md border border-guru-border bg-guru-panel px-3 py-1.5 text-sm text-gray-200"></select>
          </div>
          <div>
            <label class="mb-1 block text-xs text-gray-400" for="diff-from">From</label>
            <select id="diff-from" class="rounded-md border border-guru-border bg-guru-panel px-3 py-1.5 text-sm text-gray-200"></select>
          </div>
          <div>
            <label class="mb-1 block text-xs text-gray-400" for="diff-to">To</label>
            <select id="diff-to" class="rounded-md border border-guru-border bg-guru-panel px-3 py-1.5 text-sm text-gray-200"></select>
          </div>
          <button id="diff-btn" class="rounded-md bg-guru-accent px-4 py-1.5 text-sm font-semibold text-gray-900 hover:bg-cyan-300">
            Compare
          </button>
        </div>
        <pre id="diff-output" class="max-h-96 overflow-auto rounded-lg border border-guru-border bg-guru-panel p-4 text-xs text-gray-300"></pre>
      </div>
    </section>

  </main>

  <script>
    // Point this at the running Guru server. Override via ?api=https://host
    // for local testing, e.g. dashboard.html?api=http://localhost:8000
    const API_BASE = new URLSearchParams(location.search).get('api') || 'https://api.projectguru.me';
    document.getElementById('api-base-label').textContent = API_BASE;

    const loginPanel = document.getElementById('login-panel');
    const endpointsPanel = document.getElementById('endpoints-panel');
    const detailPanel = document.getElementById('detail-panel');
    const whoami = document.getElementById('whoami');
    const logoutBtn = document.getElementById('logout-btn');

    async function api(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `request failed (${res.status})`);
      }
      return res.json();
    }

    function show(panel) {
      [loginPanel, endpointsPanel, detailPanel].forEach((p) => p.classList.add('hidden'));
      panel.classList.remove('hidden');
    }

    function fmtEpoch(seconds) {
      if (!seconds) return '-';
      return new Date(seconds * 1000).toLocaleString();
    }

    async function checkSession() {
      try {
        const data = await api('/api/v1/auth/me');
        whoami.textContent = data.user.username;
        whoami.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        await loadEndpoints();
      } catch {
        show(loginPanel);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      errorEl.classList.add('hidden');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const data = await api('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });
        whoami.textContent = data.user.username;
        whoami.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        await loadEndpoints();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await api('/api/v1/auth/logout', { method: 'POST' }).catch(() => {});
      whoami.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      show(loginPanel);
    });

    document.getElementById('refresh-btn').addEventListener('click', loadEndpoints);
    document.getElementById('back-btn').addEventListener('click', () => show(endpointsPanel));

    async function loadEndpoints() {
      const data = await api('/api/v1/endpoints');
      const list = document.getElementById('endpoints-list');
      list.innerHTML = '';
      for (const ep of data.endpoints) {
        const alertCount = Object.values(ep.alerts || {}).reduce((a, b) => a + b, 0);
        const card = document.createElement('button');
        card.className = 'rounded-lg border border-guru-border bg-guru-panel p-4 text-left transition hover:border-guru-accent/50';
        card.innerHTML = `
          <div class="mb-1 font-semibold text-white">${ep.hostname || ep.endpoint_key}</div>
          <div class="mb-2 text-xs text-gray-500">${ep.os || 'unknown OS'}</div>
          <div class="text-xs text-gray-400">Last seen: ${fmtEpoch(ep.last_seen)}</div>
          ${alertCount ? `<div class="mt-2 text-xs font-medium text-amber-400">${alertCount} active alert(s)</div>` : ''}
        `;
        card.addEventListener('click', () => loadEndpointDetail(ep.id, ep.hostname || ep.endpoint_key));
        list.appendChild(card);
      }
      show(endpointsPanel);
    }

    let currentEndpointId = null;

    async function loadEndpointDetail(id, title) {
      currentEndpointId = id;
      const data = await api(`/api/v1/endpoints/${id}`);
      document.getElementById('detail-title').textContent = title;

      const alertsList = document.getElementById('alerts-list');
      alertsList.innerHTML = data.alerts.length
        ? data.alerts.map((a) => `
          <div class="rounded-md border border-guru-border bg-guru-panel p-3 text-sm">
            <span class="font-semibold text-amber-400">[${a.severity}]</span>
            <span class="text-gray-200">${a.title}</span>
            <div class="mt-1 text-xs text-gray-500">${a.detail}</div>
          </div>`).join('')
        : '<p class="text-sm text-gray-500">No active alerts.</p>';

      const typesList = document.getElementById('report-types-list');
      typesList.innerHTML = data.report_types.map((t) => `
        <div class="rounded-md border border-guru-border bg-guru-panel p-3 text-sm">
          <div class="font-semibold text-gray-200">${t.message_name}</div>
          <div class="text-xs text-gray-500">${t.count} snapshot(s), latest ${fmtEpoch(t.latest)}</div>
        </div>`).join('');

      const typeSelect = document.getElementById('diff-type');
      typeSelect.innerHTML = data.report_types
        .map((t) => `<option value="${t.message_name}">${t.message_name}</option>`).join('');
      typeSelect.onchange = loadReportsForDiff;

      document.getElementById('diff-output').textContent = '';
      await loadReportsForDiff();
      show(detailPanel);
    }

    async function loadReportsForDiff() {
      const messageName = document.getElementById('diff-type').value;
      if (!messageName) return;
      const data = await api(`/api/v1/endpoints/${currentEndpointId}/reports?message_name=${encodeURIComponent(messageName)}`);
      const options = data.reports
        .map((r) => `<option value="${r.id}">${fmtEpoch(r.received_at)} (#${r.id})</option>`).join('');
      document.getElementById('diff-from').innerHTML = options;
      document.getElementById('diff-to').innerHTML = options;
    }

    document.getElementById('diff-btn').addEventListener('click', async () => {
      const messageName = document.getElementById('diff-type').value;
      const fromId = document.getElementById('diff-from').value;
      const toId = document.getElementById('diff-to').value;
      const output = document.getElementById('diff-output');
      if (!messageName || !fromId || !toId) return;
      try {
        const data = await api(
          `/api/v1/endpoints/${currentEndpointId}/diff?message_name=${encodeURIComponent(messageName)}&from_id=${fromId}&to_id=${toId}`
        );
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = `Error: ${err.message}`;
      }
    });

    checkSession();
  </script>
</body>
</html>
